name: Publish npm Package

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'nyssa-ai-configuration/v[0-9]*'
      - 'nyssa-ai-configuration-ts/v[0-9]*'
      - 'npm/v[0-9]*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: nyssa-ai-configuration-ts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Stamp pinned version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG##*/v}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Pinned @nyssa-ai/configuration to version $VERSION"

      - name: Build and run tests
        run: |
          npm run build
          npm test

      - name: Publish to npm with OIDC Trusted Publishing
        run: npm publish --provenance --access public
