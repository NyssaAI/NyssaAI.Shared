name: Publish npm Package

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'nyssa-ai-configuration/v[0-9]*'
      - 'nyssa-ai-configuration-ts/v[0-9]*'
      - 'nyssa-ai-dbgateway/v[0-9]*'
      - 'nyssa-ai-dbgateway-ts/v[0-9]*'
      - 'nyssa-ai-db-gateway/v[0-9]*'
      - 'nyssa-ai-logging/v[0-9]*'
      - 'nyssa-ai-logging-ts/v[0-9]*'
      - 'npm/v[0-9]*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target package and working directory
        id: target
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ (nyssa-ai-dbgateway|nyssa-ai-dbgateway-ts|nyssa-ai-db-gateway)/v(.+) ]]; then
            DIR="nyssa-ai-dbgateway-ts"
            VERSION="${BASH_REMATCH[2]}"
          elif [[ "$TAG" =~ (nyssa-ai-logging|nyssa-ai-logging-ts)/v(.+) ]]; then
            DIR="nyssa-ai-logging-ts"
            VERSION="${BASH_REMATCH[2]}"
          elif [[ "$TAG" =~ (nyssa-ai-configuration|nyssa-ai-configuration-ts)/v(.+) ]]; then
            DIR="nyssa-ai-configuration-ts"
            VERSION="${BASH_REMATCH[2]}"
          elif [[ "$TAG" =~ v(.+) ]]; then
            # Default single-project or generic tag
            DIR="nyssa-ai-configuration-ts"
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Unsupported tag format: $TAG" >&2
            exit 1
          fi
          echo "pkg_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved target directory $DIR for version $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: ${{ steps.target.outputs.pkg_dir }}
        run: npm ci

      - name: Stamp pinned version from tag
        working-directory: ${{ steps.target.outputs.pkg_dir }}
        run: |
          VERSION="${{ steps.target.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Pinned package in ${{ steps.target.outputs.pkg_dir }} to version $VERSION"

      - name: Build and run tests
        working-directory: ${{ steps.target.outputs.pkg_dir }}
        run: |
          npm run build
          npm test

      - name: Publish to npm with OIDC Trusted Publishing
        working-directory: ${{ steps.target.outputs.pkg_dir }}
        run: npm publish --provenance --access public
