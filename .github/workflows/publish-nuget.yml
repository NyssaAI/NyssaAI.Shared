name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'NyssaAI.Result/v[0-9]*'
      - 'NyssaAI.Configuration/v[0-9]*'
      - 'NyssaAI.Logging/v[0-9]*'
      - 'NyssaAI.DbGateway/v[0-9]*'
      - 'nyssa-ai-*-cs/v[0-9]*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve target packages and stamp pinned version from tag
        id: target
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^(?:NyssaAI\.|nyssa-ai-)([^/]+?)(?:-cs)?/v(.+)$') {
            $target = $matches[1].ToLower()
            $version = $matches[2]
          } elseif ($tag -match '^v(.+)$') {
            $target = "all"
            $version = $matches[1]
          } else {
            throw "Unsupported tag format: $tag"
          }

          switch ($target) {
            "all" {
              $projects = @(
                "nyssa-ai-result-cs/src/NyssaAI.Result.csproj",
                "nyssa-ai-configuration-cs/src/NyssaAI.Configuration.csproj",
                "nyssa-ai-logging-cs/src/NyssaAI.Logging.csproj",
                "nyssa-ai-dbgateway-cs/src/NyssaAI.DbGateway.csproj"
              )
            }
            "dbgateway" {
              $projects = @(
                "nyssa-ai-result-cs/src/NyssaAI.Result.csproj",
                "nyssa-ai-configuration-cs/src/NyssaAI.Configuration.csproj",
                "nyssa-ai-dbgateway-cs/src/NyssaAI.DbGateway.csproj"
              )
            }
            "configuration" {
              $projects = @(
                "nyssa-ai-result-cs/src/NyssaAI.Result.csproj",
                "nyssa-ai-configuration-cs/src/NyssaAI.Configuration.csproj"
              )
            }
            "logging" {
              $projects = @("nyssa-ai-logging-cs/src/NyssaAI.Logging.csproj")
            }
            "result" {
              $projects = @("nyssa-ai-result-cs/src/NyssaAI.Result.csproj")
            }
            default {
              throw "Unknown target: $target"
            }
          }

          foreach ($proj in $projects) {
            $content = Get-Content -LiteralPath $proj -Raw
            $updated = $content -replace '<Version>[^<]+</Version>', "<Version>$version</Version>"
            Set-Content -LiteralPath $proj -Value $updated -NoNewline -Encoding UTF8
            Write-Host "Pinned $proj to version $version"
          }

          "projects=$($projects -join ',')" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore NyssaAI.Shared.slnx --locked-mode

      - name: Run package verification test
        shell: pwsh
        run: ./scripts/verify-packages.ps1

      - name: Pack target NuGet packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          $projects = "${{ steps.target.outputs.projects }}" -split ','
          foreach ($proj in $projects) {
            Write-Host "Packing $proj..."
            dotnet pack $proj -c Release -o ./artifacts --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Failed to pack $proj" }
          }

      - name: NuGet Login (OIDC Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: jmaynor

      - name: Push to NuGet with Trusted Publishing
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
