name: Publish Python Package to PyPI

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'nyssa-ai-configuration/v[0-9]*'
      - 'nyssa-ai-configuration-py/v[0-9]*'
      - 'nyssa-ai-dbgateway/v[0-9]*'
      - 'nyssa-ai-dbgateway-py/v[0-9]*'
      - 'py/v[0-9]*'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target package and working directory
        id: target
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^(nyssa-ai-dbgateway|nyssa-ai-dbgateway-py)/v(.+)$ ]]; then
            DIRS="nyssa-ai-dbgateway-py"
            VERSION="${BASH_REMATCH[2]}"
          elif [[ "$TAG" =~ ^(nyssa-ai-configuration|nyssa-ai-configuration-py)/v(.+)$ ]]; then
            DIRS="nyssa-ai-configuration-py"
            VERSION="${BASH_REMATCH[2]}"
          elif [[ "$TAG" =~ ^(py/)?v(.+)$ ]]; then
            DIRS="nyssa-ai-configuration-py nyssa-ai-dbgateway-py"
            VERSION="${BASH_REMATCH[2]}"
          else
            echo "Unsupported tag format: $TAG" >&2
            exit 1
          fi
          echo "pkg_dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved target directories: $DIRS for version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build
          for dir in ${{ steps.target.outputs.pkg_dirs }}; do
            echo "Installing dependencies for $dir..."
            python -m pip install -e "$dir[dev]"
          done

      - name: Stamp pinned version from tag
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
          PKG_DIRS: ${{ steps.target.outputs.pkg_dirs }}
        run: |
          python -c '
          import os
          import re
          from pathlib import Path

          version = os.environ["TARGET_VERSION"]
          for dir_name in os.environ["PKG_DIRS"].split():
              p = Path(dir_name) / "pyproject.toml"
              text = p.read_text(encoding="utf-8")
              text = re.sub(
                  r"^version\s*=\s*\"[^\"]+\"",
                  f"version = \"{version}\"",
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              p.write_text(text, encoding="utf-8")
              print(f"Pinned {dir_name} to version {version}")
          '

      - name: Run Python tests
        run: |
          for dir in ${{ steps.target.outputs.pkg_dirs }}; do
            echo "Running tests in $dir..."
            (cd "$dir" && pytest)
          done

      - name: Build wheel and source tarball
        run: |
          mkdir -p dist
          for dir in ${{ steps.target.outputs.pkg_dirs }}; do
            echo "Building $dir into dist/..."
            python -m build "$dir" --outdir dist/
          done

      - name: Publish package distributions to PyPI (Trusted Publishing OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
